name: fast-s5 checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check fast-s5 on Alpine ash
        run: |
          docker run --rm -v "$PWD:/project:ro" -w /project alpine:3.22 sh -ec '
            apk add --no-cache shellcheck
            sh -n fast-s5.sh
            sh -n tests/run.sh
            shellcheck -s sh fast-s5.sh tests/*.sh
            sh tests/run.sh
            apk add --no-cache python3
            sed '\''/^main "\$@"$/d'\'' fast-s5.sh > /tmp/fast-s5-library.sh
            . /tmp/fast-s5-library.sh
            BIN=/tmp/fast-s5-proxy
            build_proxy
            python3 tests/proxy_integration.py "$BIN"
          '
